name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Verify historical presentation integrity
        run: |
          echo "4003194fdfe82e84bcc32876c8d9ba5042d12dc5f14da726a4bd6e3edc2e6bec  docs/original-presentation.pdf" | sha256sum --check --strict

      - name: Verify historical finite-field mathematics
        run: python3 scripts/verify-historical-math.py

      - name: Java verify
        run: mvn -B -ntp verify

      - name: Rust format
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check

      - name: Rust Clippy
        run: cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path rust/Cargo.toml

      - name: Rust release build
        run: cargo build --release --locked --manifest-path rust/Cargo.toml --bin tmto

      - name: Rust smoke test
        run: cargo run --quiet --locked --manifest-path rust/Cargo.toml --bin tmto -- smoke

      - name: Java reproducibility smoke test
        run: |
          mvn -B -ntp -q exec:java \
            -Dexec.mainClass=io.github.qoosmo.hpc.ExperimentRunner \
            -Dexec.args="--state-bits 8 --trials 2 --seed 7 --hellman-chains 32 --hellman-chain-length 8 --dp-chains 32 --dp-bits 2 --dp-max-chain 16 --output /tmp/tmto-ci-smoke.csv"
          test "$(wc -l < /tmp/tmto-ci-smoke.csv | tr -d ' ')" = "7"

      - name: Diff hygiene
        run: git diff --check
