name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify historical finite-field mathematics
        run: python3 scripts/verify-historical-math.py

      - name: Java tests
        run: mvn -B -ntp test

      - name: Rust tests
        run: cargo test --locked --manifest-path rust/Cargo.toml

      - name: Rust smoke test
        run: cargo run --quiet --locked --manifest-path rust/Cargo.toml --bin tmto -- smoke

      - name: Java reproducibility smoke test
        run: |
          mvn -B -ntp -q exec:java \
            -Dexec.mainClass=io.github.qoosmo.hpc.ExperimentRunner \
            -Dexec.args="--state-bits 8 --trials 2 --seed 7 --hellman-chains 32 --hellman-chain-length 8 --dp-chains 32 --dp-bits 2 --dp-max-chain 16 --output /tmp/tmto-ci-smoke.csv"
          test "$(wc -l < /tmp/tmto-ci-smoke.csv | tr -d ' ')" = "7"

      - name: Diff hygiene
        run: git diff --check
